name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: victordasilvaf/pokespace-api

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  deploy-staging:
    name: deploy-staging
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: API_IMAGE,GHCR_TOKEN,GHCR_USER,APP_DIR,API_PORT
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/pokespace_backend}"
            cd "${APP_DIR}"
            git pull --ff-only
            export APP_DIR
            export COMPOSE_FILE=docker-compose.staging.yml
            export COMPOSE_ENV_FILE=.env.staging
            export API_PORT="${API_PORT:-3001}"
            export DEPLOY_GIT_PULL=0
            export API_IMAGE
            export GHCR_USER
            export GHCR_TOKEN
            ./scripts/deploy/remote-deploy.sh
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          APP_DIR: ${{ vars.APP_DIR }}
          API_PORT: ${{ vars.STAGING_API_PORT }}

  deploy-production:
    name: deploy-production
    needs: [build-and-push, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          envs: API_IMAGE,GHCR_TOKEN,GHCR_USER,APP_DIR,API_PORT
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/pokespace_backend}"
            cd "${APP_DIR}"
            git pull --ff-only
            export APP_DIR
            export COMPOSE_FILE=docker-compose.prod.yml
            export COMPOSE_ENV_FILE=.env.production
            export API_PORT="${API_PORT:-3000}"
            export DEPLOY_GIT_PULL=0
            export API_IMAGE
            export GHCR_USER
            export GHCR_TOKEN
            ./scripts/deploy/remote-deploy.sh
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          APP_DIR: ${{ vars.APP_DIR }}
          API_PORT: ${{ vars.PROD_API_PORT }}
